[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-account-gmail-mcp"
version = "0.1.0"
description = "MCP server that gives Claude (or any MCP client) full access to several Gmail accounts at once."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
multi-account-gmail-mcp = "multi_account_gmail_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_account_gmail_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
